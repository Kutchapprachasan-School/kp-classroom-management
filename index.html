<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ระบบจัดการชั้นเรียน — โรงเรียนกุดจับประชาสรรค์</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#F7FAFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="จัดการชั้นเรียน" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/images/teacher/school_logo.png" />
    <link rel="apple-touch-icon" href="/images/teacher/school_logo.png" />

    <!-- Google Fonts: Prompt & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Instant Preloader Styles (Zero-Flicker First Paint) -->
    <style>
      #kps-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #F7FAFF;
        font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 16px;
        box-sizing: border-box;
        overflow: hidden;
      }
      .kps-preloader-blob-1 {
        position: absolute;
        top: -120px;
        left: -120px;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: rgba(191, 219, 254, 0.45);
        filter: blur(60px);
        pointer-events: none;
      }
      .kps-preloader-blob-2 {
        position: absolute;
        bottom: -120px;
        right: -120px;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: rgba(221, 214, 254, 0.35);
        filter: blur(60px);
        pointer-events: none;
      }
      .kps-preloader-card {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 340px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid #E6EEF7;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(40, 90, 140, 0.08);
      }
      .kps-logo-container {
        position: relative;
        width: 88px;
        height: 88px;
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #FFFFFF 0%, #EFF6FF 100%);
        border: 1.5px solid #BFDBFE;
        border-radius: 20px;
        box-shadow: 0 6px 18px rgba(59, 130, 246, 0.12);
        animation: kpsFloat 3s ease-in-out infinite;
      }
      .kps-logo-img {
        width: 68px;
        height: 68px;
        object-fit: contain;
      }
      .kps-badge {
        position: absolute;
        bottom: -6px;
        right: -6px;
        background: #3B82F6;
        color: #FFFFFF;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 9999px;
        box-shadow: 0 2px 6px rgba(59, 130, 246, 0.35);
      }
      .kps-title {
        font-size: 18px;
        font-weight: 700;
        color: #163A66;
        margin: 0;
        line-height: 1.3;
      }
      .kps-subtitle {
        font-size: 13px;
        font-weight: 600;
        color: #3B82F6;
        margin: 4px 0 0;
      }
      .kps-bar-track {
        width: 100%;
        height: 6px;
        background: #E2E8F0;
        border-radius: 9999px;
        overflow: hidden;
        margin: 22px 0 12px;
        position: relative;
      }
      .kps-bar-fill {
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #3B82F6 0%, #60A5FA 50%, #3B82F6 100%);
        background-size: 200% 100%;
        animation: kpsShimmer 1.5s infinite linear;
      }
      .kps-status {
        font-size: 12px;
        font-weight: 500;
        color: #6B7C93;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        margin: 0;
      }
      .kps-dot {
        display: inline-block;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #3B82F6;
        animation: kpsBounce 1.4s infinite ease-in-out both;
      }
      .kps-dot:nth-child(1) { animation-delay: -0.32s; }
      .kps-dot:nth-child(2) { animation-delay: -0.16s; }
      .kps-footer {
        position: absolute;
        bottom: 20px;
        font-size: 11px;
        color: #94A3B8;
        text-align: center;
      }
      @keyframes kpsFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes kpsShimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      @keyframes kpsBounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-blue-100 selection:text-blue-900 font-sans">
    <div id="root">
      <!-- Instant First-Paint Loading Screen -->
      <div id="kps-preloader">
        <div class="kps-preloader-blob-1"></div>
        <div class="kps-preloader-blob-2"></div>
        <div class="kps-preloader-card">
          <div class="kps-logo-container">
            <img src="/images/teacher/school_logo.png" alt="ตราโรงเรียนกุดจับประชาสรรค์" class="kps-logo-img" onerror="this.onerror=null; this.src='/images/banners/school-logo.png';" />
            <span class="kps-badge">KPS</span>
          </div>
          <h1 class="kps-title">โรงเรียนกุดจับประชาสรรค์</h1>
          <p class="kps-subtitle">ระบบบริหารจัดการชั้นเรียน & การศึกษาดิจิทัล</p>
          <div class="kps-bar-track">
            <div class="kps-bar-fill"></div>
          </div>
          <p class="kps-status">
            กำลังเปิดระบบจัดการชั้นเรียน
            <span>
              <span class="kps-dot"></span>
              <span class="kps-dot"></span>
              <span class="kps-dot"></span>
            </span>
          </p>
        </div>
        <div class="kps-footer">
          Kutchapprachasan School Management • 2569
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
